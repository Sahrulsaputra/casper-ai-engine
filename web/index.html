<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Casper — AI Bebas untuk IT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-effects">
    <div class="grid-overlay"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
  </div>

  <div class="container">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">💻</span>
        <h1>IT Casper</h1>
      </div>
      <p class="subtitle">AI khusus IT — bebas, privat, bisa belajar sendiri</p>
      
      <!-- Burger Menu -->
      <button class="burger-menu" onclick="toggleSidebar()" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <!-- Sidebar untuk Riwayat -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>📋 Riwayat Chat</h2>
        <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
      </div>
      <div class="sidebar-content" id="sidebar-history">
        <p class="loading-history">Memuat riwayat...</p>
      </div>
      <div class="sidebar-footer">
        <button class="tool-btn danger" onclick="deleteMyData()">
          <span class="tool-icon">🗑️</span>
          <span>Hapus Semua Data</span>
        </button>
      </div>
    </div>

    <!-- Overlay untuk sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="chat-container">
      <div id="terminal" class="terminal">
        <div class="welcome-message">
          <div class="welcome-icon">🚀</div>
          <h2>Selamat Datang di IT Casper</h2>
          <p>Tanya apapun tentang programming, debugging, atau teknologi IT lainnya!</p>
        </div>
      </div>

      <div class="input-container">
        <div class="input-wrapper">
          <!-- Tombol Upload -->
          <button class="upload-btn" onclick="uploadFile()" title="Upload file">
            <span class="upload-icon">📎</span>
          </button>
          
          <input 
            type="text" 
            id="user-input" 
            placeholder="Tanya apapun tentang IT..." 
            onkeypress="if(event.key==='Enter') sendMessage()"
          />
          
          <button class="send-btn" onclick="sendMessage()">
            <span class="btn-text">Kirim</span>
            <span class="btn-icon">→</span>
          </button>
        </div>
      </div>
    </div>

    <input type="file" id="file-upload" accept=".py,.js,.json,.html,.css,.txt,.jsx,.ts,.tsx,.cpp,.c,.java,.php,.rb,.go,.rs,.swift,.kt" style="display:none;" />
  </div>

  <script src="main.js"></script>
</body>
</html>
